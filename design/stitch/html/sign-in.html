<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center p-md">
<div class="w-full max-w-md bg-document-white rounded-lg shadow-sm border border-outline-variant p-xl">
<div class="flex flex-col items-center mb-lg">
<img alt="DocuRoute Logo" class="h-16 mb-md object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQ4UMALXTM9tFxv0jzzxMVFx0AB9FzjDsIx2A7bfp1KrM1TNd5Z11i7IKUuJwso1Hy3R19kaTdYXZGzXM5xE4p2PMGWNDUTUY1cPia46nOUdLJayXDmQMU6D5Y7qrD9KNESOxLPfHjjD7XGcEjYxTOOEoTbi5NzFW8NyqUqqf0Qam02t3C8sSMS8uX2JzEbLMtnTPt9GKvQY7A9QdebalLwsIA6s-X8sJWEttAElQu5UNLDm2ut9r2-A"/>
<h1 class="font-headline-md text-headline-md text-on-surface">Sign in to DocuRoute</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Secure document management platform</p>
</div>
<form class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-secondary mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="mail" style="font-size: 20px;">mail</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 font-body-md text-body-md text-on-surface transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-secondary" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="lock" style="font-size: 20px;">lock</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 font-body-md text-body-md text-on-surface transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-deep-indigo hover:bg-primary-container text-white font-title-md text-title-md py-2 px-4 rounded border border-deep-indigo transition-colors flex justify-center items-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-document-white text-on-surface-variant font-label-md text-label-md">Or continue with</span>
</div>
</div>
<div class="mt-md">
<button class="w-full bg-document-white hover:bg-surface-container text-secondary font-title-md text-title-md py-2 px-4 rounded border border-outline-variant transition-colors flex justify-center items-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="vpn_key" style="font-size: 20px;">vpn_key</span>
                    Sign in with SSO
                </button>
</div>
</div>
<p class="mt-xl text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? <a class="font-title-md text-title-md text-primary hover:text-primary-container transition-colors" href="#">Contact Sales</a>
</p>
</div>
