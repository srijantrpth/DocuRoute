<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .glass-panel {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid theme('colors.glass-stroke');
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, theme('colors.cobalt-vibrant') 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(100px);
            z-index: -1;
            pointer-events: none;
        }

        .input-well {
            background-color: theme('colors.midnight-deep');
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.3s ease;
        }

        .input-well:focus-within {
            border-color: theme('colors.cobalt-vibrant');
            box-shadow: 0 0 0 1px theme('colors.cobalt-vibrant'), inset 0 0 10px rgba(46, 91, 255, 0.1);
        }
        
        .btn-primary {
            background: theme('colors.accent-gradient');
            color: theme('colors.on-primary-container');
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-ghost {
            background: transparent;
            border: 1px solid theme('colors.glass-stroke');
            color: theme('colors.on-surface');
            transition: all 0.2s ease;
        }
        
        .btn-ghost:hover {
            border-color: theme('colors.primary');
            background: rgba(184, 195, 255, 0.05);
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop relative overflow-hidden">
<!-- Ambient Background Effects -->
<div class="ambient-glow top-0 left-0 -translate-x-1/2 -translate-y-1/2"></div>
<div class="ambient-glow bottom-0 right-0 translate-x-1/3 translate-y-1/3" style="background: radial-gradient(circle, theme('colors.primary') 0%, transparent 70%); opacity: 0.1;"></div>
<main class="w-full max-w-md relative z-10">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg font-bold text-primary mb-2 tracking-tight">DocuRoute</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Enterprise Workflow</p>
</div>
<!-- Glass Sign In Card -->
<div class="glass-panel rounded-[24px] p-8 shadow-2xl">
<div class="mb-8">
<h2 class="font-title-lg text-title-lg text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your documents</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="input-well rounded-lg flex items-center px-4 h-12">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline-variant" id="email" placeholder="admin@enterprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="input-well rounded-lg flex items-center px-4 h-12">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none p-0 text-on-surface font-body-md text-body-md focus:ring-0 placeholder:text-outline-variant" id="password" placeholder="••••••••" required="" type="password"/>
<button class="ml-2 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-4">
<button class="btn-primary w-full h-12 rounded-[12px] font-label-md text-label-md flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-glass-stroke"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="flex-grow border-t border-glass-stroke"></div>
</div>
<button class="btn-ghost w-full h-12 rounded-[12px] font-label-md text-label-md flex items-center justify-center gap-2" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKxzV4siBrrH8t0zowOB9k2MVkiDCJjh1ggEBHd_FGPLLRX_Aszxu8xrFjp6fG0JyxocQRR1zrGIqhwlvkT8zWxczbUVls8aOhrxAXX_ZmIffwbJpJCpj7crut2BBHruBLJLW9pM4zeGlYOivlZJkfQ_3gyUUfAIbZu5-r0yE9rb2GrNUsVP9h5u3zy4UtA4Fh84CoDlwF3oWfTFMU8MNYx-vWWx0B8RMrxwzF_oTQ2nxtWsROpZHruA"/>
                        Continue with SSO
                    </button>
</div>
</form>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:underline font-label-md text-label-md" href="#">Contact Sales</a>
</p>
</div>
</main>
</body></html>
