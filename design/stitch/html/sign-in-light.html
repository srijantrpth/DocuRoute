<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased relative overflow-hidden">
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary-fixed/30 via-transparent to-transparent"></div>
<div class="absolute bottom-0 right-0 w-full h-full bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-secondary-fixed/30 via-transparent to-transparent"></div>
</div>
<div class="w-full max-w-md px-md relative z-10">
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-xs">DocuRoute</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Secure Workflow Authentication</p>
</div>
<div class="glass-panel rounded-xl p-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Sign In</h2>
<form action="#" class="space-y-md" method="POST">
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm border border-surface-variant rounded bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none font-body-md text-body-md placeholder-outline-variant" id="email" name="email" placeholder="admin@enterprise.com" required="" type="email"/>
</div>
</div>
<div class="space-y-base">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm border border-surface-variant rounded bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none font-body-md text-body-md placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-surface-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me on this device
                    </label>
</div>
<div>
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-sm bg-transparent font-label-md text-label-md text-outline">Or continue with SSO</span>
</div>
</div>
<div class="mt-md grid grid-cols-2 gap-sm">
<a class="w-full inline-flex justify-center py-xs px-md border border-surface-variant rounded bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200 items-center" href="#">
<span class="material-symbols-outlined mr-xs text-[20px]" data-icon="business">business</span>
                        Azure AD
                    </a>
<a class="w-full inline-flex justify-center py-xs px-md border border-surface-variant rounded bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200 items-center" href="#">
<span class="material-symbols-outlined mr-xs text-[20px]" data-icon="vpn_key">vpn_key</span>
                        Okta
                    </a>
</div>
</div>
</div>
<p class="mt-md text-center font-label-md text-label-md text-on-surface-variant">
            Need access? <a class="text-primary hover:underline font-semibold" href="#">Contact Administrator</a>
</p>
</div>
